title: Harun Khan
description: >-
  Harun Khan, PhD student in Computer Science at Stanford working on formal
  verification, SMT solving and the Lean theorem prover.
author: Harun Khan

url: "https://harunkhan.co"
baseurl: ""

permalink: /blog/:year/:title/
timezone: America/Los_Angeles

markdown: kramdown
kramdown:
  input: GFM
  math_engine: null
highlighter: rouge

plugins:
  - jekyll-feed

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
